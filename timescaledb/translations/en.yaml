configuration:
  databases:
    name: Databases
    description: Databases to create. owner must be postgres or one of the users; timescaledb enables the extension.
  users:
    name: Users
    description: Login roles. Passwords are applied on every start.
  external_access:
    name: Allow access from outside Home Assistant
    description: Also needs a host port for 5432/tcp in the Network section. Home Assistant and add-ons can always connect.
  pg_hba:
    name: Client authentication rules
    description: Extra pg_hba.conf rules, checked before the defaults. Rules of type local take no address.
  max_connections:
    name: Max connections
  tune:
    name: Auto-tune
    description: Run timescaledb-tune on every start.
  memory:
    name: Memory for tuning
    description: e.g. 2GB. Defaults to a quarter of the host's RAM.
  cpus:
    name: CPUs for tuning
    description: Defaults to all CPUs.
  postgresql_config:
    name: PostgreSQL settings
    description: Extra settings as "name = value".
  telemetry:
    name: TimescaleDB telemetry
  explorer:
    name: DB explorer
    description: Read-only DbGate web UI in the add-on's Web UI / sidebar panel. Adds the login role postgres-addon-ui-explorer; turning it off revokes that login.
network:
  5432/tcp: PostgreSQL (only needed for clients outside Home Assistant)
