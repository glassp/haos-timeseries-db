name: TimescaleDB
version: "1.1.0"
slug: timescaledb
description: PostgreSQL 18 with TimescaleDB for long-term time-series data
url: https://github.com/glassp/haos-timeseries-db/tree/main/timescaledb
arch:
  - amd64
  - aarch64
startup: services
init: false
# Hot backups: the pre hook dumps every database to /data/dump and the raw
# cluster files are excluded; a start with dumps but no cluster restores them.
backup_pre: /usr/local/bin/addon-backup-pre
backup_post: /usr/local/bin/addon-backup-post
backup_exclude:
  - postgres/**
  - data/postgres/**
  - postgres.upgrade/**
  - data/postgres.upgrade/**
# Give PostgreSQL time to finish a checkpoint on shutdown.
timeout: 120
# Read-only lookup of the published port, to warn about a mismatch with external_access.
hassio_api: true
# Optional DB explorer (DbGate), only reachable through Home Assistant.
ingress: true
panel_icon: mdi:database-search
panel_title: DB Explorer
map:
  - type: share
    read_only: false
ports:
  5432/tcp: null
ports_description:
  5432/tcp: PostgreSQL (only needed for clients outside Home Assistant)
options:
  databases:
    - name: homeassistant
      owner: homeassistant
      timescaledb: true
  users:
    - name: homeassistant
      password: ""
  external_access: false
  pg_hba: []
  max_connections: 100
  tune: true
  postgresql_config: []
  telemetry: false
  explorer: false
schema:
  databases:
    - name: match(^[a-z_][a-z0-9_]{0,62}$)
      owner: match(^[a-z_][a-z0-9_]{0,62}$)?
      timescaledb: bool?
  users:
    - name: match(^[a-z_][a-z0-9_]{0,62}$)
      password: password
      superuser: bool?
  external_access: bool
  pg_hba:
    - type: list(local|host|hostssl|hostnossl)
      database: str
      user: str
      address: str?
      method: list(trust|reject|scram-sha-256|md5|password|cert)
  max_connections: int(10,1000)
  tune: bool
  memory: match(^[0-9]+(MB|GB)$)?
  cpus: int(1,128)?
  postgresql_config:
    - match(^[a-z_.]+\s*=\s*.+$)
  telemetry: bool
  explorer: bool
